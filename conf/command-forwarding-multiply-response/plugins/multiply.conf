#
# SNMP Proxy Forwarder: multiply plugin configuration
#
# Format: "OID-pattern" multiplier
#
# This configuration file specifies which OIDs should be multiplied and by what factor

# Multiply sysUpTime (1.3.6.1.2.1.1.3.0) by 10
"^1\.3\.6\.1\.2\.1\.1\.3\.0$" 10

# Multiply all interface counters (1.3.6.1.2.1.2.2.1.10.*) by 100
# This would make traffic appear 100x higher
"^1\.3\.6\.1\.2\.1\.2\.2\.1\.10\..*$" 100

# Multiply any counter in the system branch by 10
"^1\.3\.6\.1\.2\.1\.1\..*$" 10
