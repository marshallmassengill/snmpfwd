name: tests

on:
  push:
    branches: [rebuild]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install net-snmp CLI tools, snmpd, snmptrapd
        # Debian's snmpd package ships both snmpd and snmptrapd. snmp
        # provides snmpget / snmpwalk / snmpbulkget / snmptrap etc.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends snmp snmpd

      - name: Install snmpfwd and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest snmpsim-lextudio

      - name: Run test suite
        run: |
          python -m pytest -v tests/
